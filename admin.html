<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiDoctorYa - Admin Panel</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#0f172a', light: '#1e3a5f' },
            primary: { DEFAULT: '#6366F1', light: '#818CF8' }
          }
        }
      }
    };
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
    .gradient-navy { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); }
    .gradient-primary { background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%); }
    .gradient-accent { background: linear-gradient(135deg, #10B981 0%, #059669 100%); }
    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease forwards; }
    .animate-delay-1 { animation-delay: 100ms; opacity: 0; }
    .animate-delay-2 { animation-delay: 200ms; opacity: 0; }
    .animate-delay-3 { animation-delay: 300ms; opacity: 0; }
    .tab-active { border-bottom: 2px solid #6366F1; color: #6366F1; font-weight: 700; }
    .tab-inactive { border-bottom: 2px solid transparent; color: #9CA3AF; }
    input:focus, textarea:focus, select:focus { outline: none; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .toggle-switch { position: relative; width: 44px; height: 24px; cursor: pointer; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: #CBD5E1; border-radius: 24px; transition: 0.3s; }
    .toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
    .toggle-switch input:checked + .toggle-slider { background: #10B981; }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
    .section-collapse { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
    .section-collapse.open { max-height: 5000px; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- PIN Screen -->
  <div id="pin-screen" class="min-h-screen flex flex-col">
    <div class="gradient-navy text-white px-5 pt-14 pb-10 relative overflow-hidden">
      <div class="absolute top-0 right-0 w-40 h-40 bg-white/5 rounded-full -translate-y-1/2 translate-x-1/2"></div>
      <p class="text-xs text-white/40 mb-1">MiDoctorYa</p>
      <h1 class="text-2xl font-bold">Panel de Administraci&oacute;n</h1>
      <p class="text-sm text-white/50 mt-1">Gesti&oacute;n de usuarios y configuraci&oacute;n</p>
    </div>
    <div class="flex-1 flex items-start justify-center px-4 -mt-5">
      <div class="bg-white rounded-2xl shadow-lg p-8 text-center w-full max-w-sm animate-fade-in">
        <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-red-500 to-orange-500 flex items-center justify-center text-3xl shadow-lg">&#x1F510;</div>
        <h3 class="text-lg font-bold text-gray-800 mb-2">Acceso Restringido</h3>
        <p class="text-sm text-gray-400 mb-5">Ingresa el PIN de administrador</p>
        <input type="password" id="admin-pin" maxlength="4" class="w-36 mx-auto block text-center text-2xl tracking-[0.5em] bg-gray-100 rounded-xl py-3 px-4 border border-gray-200" placeholder="····">
        <button id="pin-submit" class="mt-5 w-full py-3 rounded-xl bg-gradient-to-r from-red-500 to-orange-500 text-white font-bold text-sm shadow-lg active:scale-[0.98] transition-transform">Acceder</button>
        <p id="pin-error" class="text-red-500 text-xs mt-3 hidden">PIN incorrecto</p>
      </div>
    </div>
  </div>

  <!-- Admin Dashboard (hidden) -->
  <div id="admin-dashboard" class="hidden">
    <!-- Header -->
    <div class="gradient-navy text-white px-5 pt-10 pb-8 relative overflow-hidden">
      <div class="absolute top-0 right-0 w-40 h-40 bg-white/5 rounded-full -translate-y-1/2 translate-x-1/2"></div>
      <div class="flex items-center justify-between">
        <div>
          <p class="text-xs text-white/40 mb-1">MiDoctorYa Admin</p>
          <h1 class="text-xl font-bold">Dashboard</h1>
        </div>
        <button id="admin-logout" class="px-4 py-2 rounded-lg bg-white/10 text-white/70 text-xs font-semibold hover:bg-white/20 transition">Cerrar Sesi&oacute;n</button>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="px-4 -mt-4 mb-5">
      <div class="grid grid-cols-3 gap-2" id="stats-cards"></div>
    </div>

    <!-- Tabs -->
    <div class="px-4 mb-4">
      <div class="flex border-b border-gray-200 overflow-x-auto" id="admin-tabs" style="scrollbar-width:none;">
        <button data-tab="users" class="flex-shrink-0 py-3 text-xs sm:text-sm text-center tab-active transition whitespace-nowrap px-3">Usuarios</button>
        <button data-tab="mp-balance" class="flex-shrink-0 py-3 text-xs sm:text-sm text-center tab-inactive transition whitespace-nowrap px-3">Balance MP</button>
        <button data-tab="subscriptions" class="flex-shrink-0 py-3 text-xs sm:text-sm text-center tab-inactive transition whitespace-nowrap px-3">Suscripciones</button>
        <button data-tab="api-config" class="flex-shrink-0 py-3 text-xs sm:text-sm text-center tab-inactive transition whitespace-nowrap px-3">API Config</button>
        <button data-tab="guide" class="flex-shrink-0 py-3 text-xs sm:text-sm text-center tab-inactive transition whitespace-nowrap px-3">Gu&iacute;a</button>
        <button data-tab="env" class="flex-shrink-0 py-3 text-xs sm:text-sm text-center tab-inactive transition whitespace-nowrap px-3">Variables</button>
        <button data-tab="promo-codes" class="flex-shrink-0 py-3 text-xs sm:text-sm text-center tab-inactive transition whitespace-nowrap px-3">Promos</button>
        <button data-tab="app-config" class="flex-shrink-0 py-3 text-xs sm:text-sm text-center tab-inactive transition whitespace-nowrap px-3">Config App</button>
      </div>
    </div>

    <!-- Tab Content -->
    <div class="px-4 pb-10" id="tab-content"></div>
  </div>

  <script>
    (function () {
      var ADMIN_PIN = '2835';
      var CONFIG_KEY = 'dya_admin_config';
      var USERS_KEY = 'dya_admin_users';
      var CONDITIONS_KEY = 'dya_config_conditions';
      var ALLERGIES_KEY = 'dya_config_allergies';
      var FOOD_RULES_KEY = 'dya_config_food_rules';
      var SPECIALTIES_KEY = 'dya_config_specialties';
      var EXERCISE_RULES_KEY = 'dya_config_exercise_rules';
      var DOCTORS_KEY = 'dya_doctors_list';
      var currentTab = 'users';

      // ========== SEED DEFAULTS ==========
      function seedDefaults() {
        if (!localStorage.getItem(CONDITIONS_KEY)) {
          localStorage.setItem(CONDITIONS_KEY, JSON.stringify([
            { name: 'Diabetes', icon: '🩸', active: true },
            { name: 'Hipertensi\u00f3n', icon: '❤️‍🩹', active: true },
            { name: 'Asma', icon: '🫁', active: true },
            { name: 'Enfermedad card\u00edaca', icon: '🫀', active: true },
            { name: 'Enfermedad renal', icon: '🫘', active: true },
            { name: 'Artritis', icon: '🦴', active: true },
            { name: 'Osteoporosis', icon: '🦠', active: true },
            { name: 'Hipotiroidismo', icon: '🦋', active: true },
            { name: 'Anemia', icon: '💉', active: true },
            { name: 'EPOC', icon: '🌬️', active: true }
          ]));
        }
        if (!localStorage.getItem(ALLERGIES_KEY)) {
          localStorage.setItem(ALLERGIES_KEY, JSON.stringify([
            { name: 'Man\u00ed/Cacahuate', icon: '🥜', active: true },
            { name: 'Frutos secos', icon: '🌰', active: true },
            { name: 'Mariscos', icon: '🦐', active: true },
            { name: 'L\u00e1cteos/Lactosa', icon: '🥛', active: true },
            { name: 'Gluten/Trigo', icon: '🌾', active: true },
            { name: 'Huevo', icon: '🥚', active: true },
            { name: 'Soya', icon: '🫘', active: true },
            { name: 'Medicamentos', icon: '💊', active: true }
          ]));
        }
        if (!localStorage.getItem(SPECIALTIES_KEY)) {
          localStorage.setItem(SPECIALTIES_KEY, JSON.stringify([
            'Acompa\u00f1amiento Fitness',
            'Nutrici\u00f3n',
            'Psicolog\u00eda',
            'Medicina General',
            'Cardiolog\u00eda',
            'Endocrinolog\u00eda'
          ]));
        }
        if (!localStorage.getItem(FOOD_RULES_KEY)) {
          localStorage.setItem(FOOD_RULES_KEY, JSON.stringify({
            'Diabetes': {
              recommended: [
                { food: 'Avena', reason: 'Fibra soluble estabiliza glucosa' },
                { food: 'Legumbres', reason: 'Bajo \u00edndice gluc\u00e9mico, alta fibra' },
                { food: 'Verduras de hoja verde', reason: 'Bajas en carbohidratos, ricas en nutrientes' },
                { food: 'Pescado (salm\u00f3n, sardinas)', reason: 'Omega-3 reduce inflamaci\u00f3n' },
                { food: 'Nueces y almendras', reason: 'Grasas saludables, bajo \u00edndice gluc\u00e9mico' }
              ],
              notRecommended: [
                { food: 'Az\u00facar refinada', reason: 'Eleva glucosa r\u00e1pidamente' },
                { food: 'Pan blanco', reason: 'Alto \u00edndice gluc\u00e9mico, poca fibra' },
                { food: 'Bebidas azucaradas', reason: 'Picos de glucosa inmediatos' },
                { food: 'Dulces y pasteles', reason: 'Az\u00facares simples, grasas trans' },
                { food: 'Arroz blanco en exceso', reason: 'Alto \u00edndice gluc\u00e9mico' }
              ]
            },
            'Hipertensi\u00f3n': {
              recommended: [
                { food: 'Banano/Pl\u00e1tano', reason: 'Alto en potasio, regula presi\u00f3n arterial' },
                { food: 'Espinacas', reason: 'Magnesio y potasio para vasos sangu\u00edneos' },
                { food: 'Ajo', reason: 'Propiedades vasodilatadoras naturales' },
                { food: 'Remolacha/Betabel', reason: 'Nitratos naturales reducen presi\u00f3n' },
                { food: 'Yogur natural sin az\u00facar', reason: 'Calcio y probi\u00f3ticos cardiovasculares' }
              ],
              notRecommended: [
                { food: 'Sal en exceso', reason: 'Retenci\u00f3n de l\u00edquidos, sube presi\u00f3n' },
                { food: 'Embutidos', reason: 'Alto contenido de sodio y nitratos' },
                { food: 'Enlatados', reason: 'Sodio como conservante en exceso' },
                { food: 'Quesos curados', reason: 'Muy altos en sodio' },
                { food: 'Alcohol', reason: 'Eleva presi\u00f3n arterial directamente' }
              ]
            },
            'Enfermedad renal': {
              recommended: [
                { food: 'Manzana', reason: 'Baja en potasio y f\u00f3sforo' },
                { food: 'Repollo/Col', reason: 'Bajo en potasio, rico en vitaminas' },
                { food: 'Pimiento rojo', reason: 'Antioxidantes sin exceso de potasio' },
                { food: 'Clara de huevo', reason: 'Prote\u00edna de alta calidad, bajo f\u00f3sforo' },
                { food: 'Cebolla', reason: 'Baja en potasio, da sabor sin sal' }
              ],
              notRecommended: [
                { food: 'Banano/Pl\u00e1tano', reason: 'Muy alto en potasio' },
                { food: 'Tomate', reason: 'Alto en potasio' },
                { food: 'Chocolate', reason: 'Alto en f\u00f3sforo y potasio' },
                { food: 'Frutos secos', reason: 'Exceso de f\u00f3sforo y potasio' },
                { food: 'Refrescos oscuros', reason: 'Altos en \u00e1cido fosf\u00f3rico' }
              ]
            },
            'Asma': {
              recommended: [
                { food: 'Manzana', reason: 'Quercetina antiinflamatoria para v\u00edas a\u00e9reas' },
                { food: 'Jengibre', reason: 'Broncodilatador natural, antiinflamatorio' },
                { food: 'C\u00farcuma', reason: 'Curcumina reduce inflamaci\u00f3n bronquial' },
                { food: 'Pescados grasos', reason: 'Omega-3 reduce inflamaci\u00f3n pulmonar' },
                { food: 'Espinacas', reason: 'Magnesio relaja m\u00fasculos bronquiales' }
              ],
              notRecommended: [
                { food: 'Sulfitos (vino, frutos secos procesados)', reason: 'Desencadenante com\u00fan de asma' },
                { food: 'Mariscos', reason: 'Al\u00e9rgeno com\u00fan, agrava s\u00edntomas' },
                { food: 'Alimentos muy fr\u00edos', reason: 'Pueden provocar broncoespasmo' },
                { food: 'Comida chatarra procesada', reason: 'Conservantes y aditivos inflamatorios' },
                { food: 'L\u00e1cteos enteros en exceso', reason: 'Pueden aumentar producci\u00f3n de moco' }
              ]
            }
          }));
        }
        if (!localStorage.getItem(EXERCISE_RULES_KEY)) {
          localStorage.setItem(EXERCISE_RULES_KEY, JSON.stringify({
            'Enfermedad card\u00edaca': [
              { restriction: 'Evitar ejercicio de alta intensidad sin supervisi\u00f3n', severity: 'Alta' },
              { restriction: 'Monitorear frecuencia card\u00edaca, no superar 120 bpm', severity: 'Media' },
              { restriction: 'No realizar ejercicios isom\u00e9tricos prolongados', severity: 'Media' },
              { restriction: 'Evitar ambientes extremadamente fr\u00edos o calientes', severity: 'Alta' }
            ],
            'Asma': [
              { restriction: 'Evitar ejercicio en ambientes fr\u00edos o con poluci\u00f3n', severity: 'Media' },
              { restriction: 'Llevar siempre inhalador de rescate', severity: 'Alta' },
              { restriction: 'Calentamiento progresivo de al menos 10 minutos', severity: 'Media' },
              { restriction: 'Preferir nataci\u00f3n sobre running en clima seco', severity: 'Baja' }
            ],
            'Enfermedad renal': [
              { restriction: 'Evitar ejercicio extenuante que cause deshidrataci\u00f3n', severity: 'Alta' },
              { restriction: 'Hidrataci\u00f3n controlada seg\u00fan indicaci\u00f3n m\u00e9dica', severity: 'Alta' },
              { restriction: 'No realizar actividades de impacto si hay anemia asociada', severity: 'Media' }
            ],
            'Artritis': [
              { restriction: 'Evitar ejercicios de alto impacto (correr, saltar)', severity: 'Alta' },
              { restriction: 'Preferir ejercicio acu\u00e1tico para reducir carga articular', severity: 'Media' },
              { restriction: 'No forzar articulaciones inflamadas', severity: 'Alta' },
              { restriction: 'Realizar estiramientos suaves antes de actividad', severity: 'Baja' }
            ],
            'Osteoporosis': [
              { restriction: 'Evitar movimientos bruscos de flexi\u00f3n/torsi\u00f3n espinal', severity: 'Alta' },
              { restriction: 'No realizar saltos de altura', severity: 'Alta' },
              { restriction: 'Ejercicios de equilibrio para prevenir ca\u00eddas', severity: 'Media' },
              { restriction: 'Caminata y pesas livianas son recomendados', severity: 'Baja' }
            ]
          }));
        }
      }

      seedDefaults();

      // ========== HELPERS ==========
      function getJSON(key) {
        try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
      }
      function setJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
      function getUsers() { return getJSON(USERS_KEY) || []; }
      function saveUsers(u) { setJSON(USERS_KEY, u); }
      function getConfig() { return getJSON(CONFIG_KEY) || {}; }
      function saveConfig(c) { setJSON(CONFIG_KEY, c); }
      function getConditions() { return getJSON(CONDITIONS_KEY) || []; }
      function saveConditions(c) { setJSON(CONDITIONS_KEY, c); }
      function getAllergies() { return getJSON(ALLERGIES_KEY) || []; }
      function saveAllergies(a) { setJSON(ALLERGIES_KEY, a); }
      function getSpecialties() { return getJSON(SPECIALTIES_KEY) || []; }
      function saveSpecialties(s) { setJSON(SPECIALTIES_KEY, s); }
      function getFoodRules() { return getJSON(FOOD_RULES_KEY) || {}; }
      function saveFoodRules(r) { setJSON(FOOD_RULES_KEY, r); }
      function getExerciseRules() { return getJSON(EXERCISE_RULES_KEY) || {}; }
      function saveExerciseRules(r) { setJSON(EXERCISE_RULES_KEY, r); }
      function getDoctors() { return getJSON(DOCTORS_KEY) || []; }
      function saveDoctors(d) { setJSON(DOCTORS_KEY, d); }

      function esc(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      // --- PIN Auth ---
      var pinScreen = document.getElementById('pin-screen');
      var dashboard = document.getElementById('admin-dashboard');
      var pinInput = document.getElementById('admin-pin');
      var pinError = document.getElementById('pin-error');

      document.getElementById('pin-submit').onclick = checkPin;
      pinInput.onkeydown = function (e) { if (e.key === 'Enter') checkPin(); };

      function checkPin() {
        if (pinInput.value === ADMIN_PIN) {
          pinScreen.classList.add('hidden');
          dashboard.classList.remove('hidden');
          renderDashboard();
        } else {
          pinError.classList.remove('hidden');
          pinInput.value = '';
          pinInput.focus();
        }
      }

      document.getElementById('admin-logout').onclick = function () {
        dashboard.classList.add('hidden');
        pinScreen.classList.remove('hidden');
        pinInput.value = '';
        pinError.classList.add('hidden');
      };

      // --- Dashboard ---
      function renderDashboard() {
        renderStats();
        renderTabs();
        renderTabContent();
      }

      function renderStats() {
        var users = getUsers();
        var today = new Date().toISOString().split('T')[0];
        var todayActive = users.filter(function (u) { return u.lastActive && u.lastActive.startsWith(today); });
        var totalSessions = users.reduce(function (sum, u) { return sum + (u.sessions || 0); }, 0);

        document.getElementById('stats-cards').innerHTML =
          '<div class="bg-white rounded-xl shadow-sm p-4 text-center border border-gray-100 animate-fade-in">' +
            '<p class="text-3xl font-black text-indigo-600">' + users.length + '</p>' +
            '<p class="text-[10px] text-gray-400 uppercase font-semibold mt-1">Total Usuarios</p>' +
          '</div>' +
          '<div class="bg-white rounded-xl shadow-sm p-4 text-center border border-gray-100 animate-fade-in animate-delay-1">' +
            '<p class="text-3xl font-black text-emerald-600">' + todayActive.length + '</p>' +
            '<p class="text-[10px] text-gray-400 uppercase font-semibold mt-1">Activos Hoy</p>' +
          '</div>' +
          '<div class="bg-white rounded-xl shadow-sm p-4 text-center border border-gray-100 animate-fade-in animate-delay-2">' +
            '<p class="text-3xl font-black text-amber-600">' + totalSessions + '</p>' +
            '<p class="text-[10px] text-gray-400 uppercase font-semibold mt-1">Sesiones</p>' +
          '</div>';
      }

      // --- Tabs ---
      function renderTabs() {
        var tabs = document.querySelectorAll('#admin-tabs button');
        tabs.forEach(function (btn) {
          btn.className = btn.dataset.tab === currentTab
            ? 'flex-shrink-0 py-3 text-xs sm:text-sm text-center tab-active transition whitespace-nowrap px-3'
            : 'flex-shrink-0 py-3 text-xs sm:text-sm text-center tab-inactive transition whitespace-nowrap px-3';
          btn.onclick = function () {
            currentTab = btn.dataset.tab;
            renderTabs();
            renderTabContent();
          };
        });
      }

      function renderTabContent() {
        var container = document.getElementById('tab-content');
        switch (currentTab) {
          case 'users': renderUsersTab(container); break;
          case 'mp-balance': renderMPBalanceTab(container); break;
          case 'subscriptions': renderSubscriptionsTab(container); break;
          case 'api-config': renderApiConfigTab(container); break;
          case 'guide': renderGuideTab(container); break;
          case 'env': renderEnvTab(container); break;
          case 'promo-codes': renderPromoCodesTab(container); break;
          case 'app-config': renderAppConfigTab(container); break;
        }
      }

      // --- Users Tab ---
      function renderUsersTab(container) {
        var users = getUsers();
        if (users.length === 0) {
          container.innerHTML =
            '<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-10 text-center animate-fade-in">' +
              '<p class="text-4xl mb-3">&#x1F465;</p>' +
              '<p class="text-gray-400 text-sm">No hay usuarios registrados a&uacute;n</p>' +
            '</div>';
          return;
        }

        var html = '<div class="space-y-3">';
        users.forEach(function (u, i) {
          var isActive = u.status === 'active';
          var initial = (u.name || 'U')[0].toUpperCase();
          var borderClass = isActive ? 'border-gray-100' : 'border-red-200 bg-red-50/40';
          var avatarClass = isActive ? 'bg-gradient-to-br from-indigo-500 to-purple-500' : 'bg-gray-300';
          var toggleClass = isActive ? 'bg-red-50 text-red-500 hover:bg-red-100' : 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100';
          var toggleLabel = isActive ? 'Desactivar' : 'Activar';

          html +=
            '<div class="bg-white rounded-xl shadow-sm border ' + borderClass + ' p-4 animate-fade-in" style="animation-delay:' + (i * 60) + 'ms">' +
              '<div class="flex items-center gap-3">' +
                '<div class="w-11 h-11 rounded-xl ' + avatarClass + ' flex items-center justify-center text-white font-bold text-sm shrink-0">' + initial + '</div>' +
                '<div class="flex-1 min-w-0">' +
                  '<p class="text-sm font-bold text-gray-800 truncate">' + (u.name || 'Sin nombre') + '</p>' +
                  '<p class="text-[11px] text-gray-400 truncate">' + u.email + '</p>' +
                  '<div class="flex flex-wrap gap-x-3 gap-y-0.5 mt-1">' +
                    (u.phone ? '<span class="text-[10px] text-gray-400">&#x1F4F1; ' + u.phone + '</span>' : '') +
                    '<span class="text-[10px] text-gray-400">&#x1F4CA; ' + (u.sessions || 0) + ' sesiones</span>' +
                    (u.lastActive ? '<span class="text-[10px] text-gray-400">&#x1F550; ' + u.lastActive.split('T')[0] + '</span>' : '') +
                    (u.birthdate ? '<span class="text-[10px] text-gray-400">&#x1F382; ' + u.birthdate + '</span>' : '') +
                  '</div>' +
                '</div>' +
                '<button class="toggle-user text-[10px] px-3 py-1.5 rounded-lg font-bold ' + toggleClass + ' transition shrink-0" data-index="' + i + '">' + toggleLabel + '</button>' +
              '</div>' +
            '</div>';
        });
        html += '</div>';
        container.innerHTML = html;

        container.querySelectorAll('.toggle-user').forEach(function (btn) {
          btn.onclick = function () {
            var users = getUsers();
            var idx = parseInt(btn.dataset.index);
            users[idx].status = users[idx].status === 'active' ? 'suspended' : 'active';
            saveUsers(users);
            renderDashboard();
          };
        });
      }

      function _fetchMPData(accessToken) {
        var serverBase = window.location.origin;

        // Fetch account info
        fetch(serverBase + '/api/mp/balance?access_token=' + encodeURIComponent(accessToken))
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.error) {
              document.getElementById('mp-account-info').textContent = 'Error: ' + (data.details || data.error);
              return;
            }
            var info = (data.nickname || '') + ' - ' + (data.email || '') + ' (' + (data.country_id || '') + ')';
            document.getElementById('mp-account-info').textContent = info;
            document.getElementById('mp-balance-status').textContent = 'Cuenta conectada correctamente';
            document.getElementById('mp-balance-status').className = 'text-xs text-center mt-2 text-emerald-500';
          })
          .catch(function(err) {
            document.getElementById('mp-account-info').textContent = 'Error de conexion';
            document.getElementById('mp-balance-status').textContent = 'Error: ' + err.message;
            document.getElementById('mp-balance-status').className = 'text-xs text-center mt-2 text-red-500';
          });

        // Fetch recent payments
        fetch(serverBase + '/api/mp/payments?access_token=' + encodeURIComponent(accessToken) + '&limit=10')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.error) {
              document.getElementById('mp-payments-list').innerHTML =
                '<p class="text-center py-4 text-red-400 text-sm">Error: ' + esc(data.details || data.error) + '</p>';
              return;
            }

            var payments = data.payments || [];
            document.getElementById('mp-payments-count').textContent = data.total + ' total';

            // Calculate monthly stats
            var now = new Date();
            var thisMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
            var lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            var lastMonth = lastMonthDate.getFullYear() + '-' + String(lastMonthDate.getMonth() + 1).padStart(2, '0');

            var thisMonthPayments = payments.filter(function(p) { return p.status === 'approved' && (p.date_approved || p.date_created || '').startsWith(thisMonth); });
            var lastMonthPayments = payments.filter(function(p) { return p.status === 'approved' && (p.date_approved || p.date_created || '').startsWith(lastMonth); });

            var thisMonthTotal = thisMonthPayments.reduce(function(s, p) { return s + (p.amount || 0); }, 0);
            var lastMonthTotal = lastMonthPayments.reduce(function(s, p) { return s + (p.amount || 0); }, 0);

            document.getElementById('mp-month-count').textContent = thisMonthPayments.length + ' pagos';
            document.getElementById('mp-month-total').textContent = '$' + thisMonthTotal.toLocaleString('es-CO');
            document.getElementById('mp-last-month-count').textContent = lastMonthPayments.length + ' pagos';
            document.getElementById('mp-last-month-total').textContent = '$' + lastMonthTotal.toLocaleString('es-CO');

            if (payments.length === 0) {
              document.getElementById('mp-payments-list').innerHTML =
                '<p class="text-center py-4 text-gray-300 text-sm">No hay pagos recientes</p>';
              return;
            }

            var html = '<div class="overflow-x-auto"><table class="w-full text-xs">' +
              '<thead><tr class="border-b border-gray-200">' +
                '<th class="text-left py-2 px-1 text-gray-400 font-semibold">Fecha</th>' +
                '<th class="text-left py-2 px-1 text-gray-400 font-semibold">Email</th>' +
                '<th class="text-left py-2 px-1 text-gray-400 font-semibold">Descripcion</th>' +
                '<th class="text-right py-2 px-1 text-gray-400 font-semibold">Monto</th>' +
                '<th class="text-center py-2 px-1 text-gray-400 font-semibold">Estado</th>' +
              '</tr></thead><tbody>';

            payments.forEach(function(p) {
              var date = (p.date_approved || p.date_created || '').split('T')[0] || '-';
              var statusColors = {
                approved: 'bg-emerald-100 text-emerald-700',
                pending: 'bg-amber-100 text-amber-700',
                rejected: 'bg-red-100 text-red-700',
                in_process: 'bg-blue-100 text-blue-700'
              };
              var statusLabels = {
                approved: 'Aprobado',
                pending: 'Pendiente',
                rejected: 'Rechazado',
                in_process: 'En proceso'
              };
              var stClass = statusColors[p.status] || 'bg-gray-100 text-gray-500';
              var stLabel = statusLabels[p.status] || p.status;
              var plan = '';
              if (p.external_reference) {
                var parts = p.external_reference.split('_');
                if (parts.length >= 3) plan = parts[2];
              }

              html += '<tr class="border-b border-gray-50">' +
                '<td class="py-2 px-1 text-gray-600">' + date + '</td>' +
                '<td class="py-2 px-1 text-gray-600 truncate max-w-[100px]">' + esc(p.payer_email || '-') + '</td>' +
                '<td class="py-2 px-1 text-gray-600 truncate max-w-[120px]">' + esc(plan || p.description || '-') + '</td>' +
                '<td class="py-2 px-1 text-gray-800 font-bold text-right">$' + (p.amount || 0).toLocaleString('es-CO') + '</td>' +
                '<td class="py-2 px-1 text-center"><span class="text-[10px] px-2 py-0.5 rounded-full font-bold ' + stClass + '">' + stLabel + '</span></td>' +
              '</tr>';
            });
            html += '</tbody></table></div>';
            document.getElementById('mp-payments-list').innerHTML = html;
          })
          .catch(function(err) {
            document.getElementById('mp-payments-list').innerHTML =
              '<p class="text-center py-4 text-red-400 text-sm">Error: ' + err.message + '</p>';
          });
      }

      function _bindSubscriptionEvents() {
        // Lookup
        document.getElementById('sub-lookup-btn').onclick = function() {
          var email = document.getElementById('sub-lookup-email').value.trim();
          if (!email) return;
          var subKey = 'dya_subscription_' + email;
          var raw = localStorage.getItem(subKey);
          var resultDiv = document.getElementById('sub-lookup-result');
          resultDiv.classList.remove('hidden');

          if (!raw) {
            resultDiv.innerHTML = '<div class="p-3 rounded-xl bg-gray-50 border border-gray-200 text-center"><p class="text-sm text-gray-400">No se encontr&oacute; suscripci&oacute;n para este email</p></div>';
            return;
          }

          try {
            var sub = JSON.parse(raw);
            var statusColors = {
              active: 'bg-emerald-100 text-emerald-700',
              trial: 'bg-blue-100 text-blue-700',
              expired: 'bg-amber-100 text-amber-700',
              grace: 'bg-orange-100 text-orange-700',
              blocked: 'bg-red-100 text-red-700',
              deleted: 'bg-gray-100 text-gray-500'
            };
            var statusLabels = {
              active: 'Activa', trial: 'Trial', expired: 'Vencida',
              grace: 'Gracia', blocked: 'Bloqueada', deleted: 'Eliminada'
            };
            var stClass = statusColors[sub.status] || 'bg-gray-100 text-gray-500';
            var stLabel = statusLabels[sub.status] || sub.status;
            var expiresDate = sub.expiresAt ? new Date(sub.expiresAt).toLocaleDateString('es-CO') : '-';
            var startDate = sub.startDate ? new Date(sub.startDate).toLocaleDateString('es-CO') : '-';
            var planLabels = { mensual: 'Mensual', trimestral: 'Trimestral', anual: 'Anual' };

            resultDiv.innerHTML =
              '<div class="p-4 rounded-xl bg-gray-50 border border-gray-200 space-y-2">' +
                '<div class="flex items-center justify-between">' +
                  '<span class="text-sm font-bold text-gray-800">' + esc(sub.email) + '</span>' +
                  '<span class="text-[10px] px-2.5 py-1 rounded-full font-bold ' + stClass + '">' + stLabel + '</span>' +
                '</div>' +
                '<div class="grid grid-cols-2 gap-2 text-xs">' +
                  '<div><span class="text-gray-400">Plan:</span> <span class="font-semibold">' + (planLabels[sub.plan] || sub.plan) + '</span></div>' +
                  '<div><span class="text-gray-400">Inicio:</span> <span class="font-semibold">' + startDate + '</span></div>' +
                  '<div><span class="text-gray-400">Vence:</span> <span class="font-semibold">' + expiresDate + '</span></div>' +
                  '<div><span class="text-gray-400">Pagos:</span> <span class="font-semibold">' + (sub.paymentHistory ? sub.paymentHistory.length : 0) + '</span></div>' +
                '</div>' +
                (sub.gracePeriodEndsAt ? '<p class="text-xs text-orange-600">Gracia hasta: ' + new Date(sub.gracePeriodEndsAt).toLocaleDateString('es-CO') + '</p>' : '') +
                (sub.deletionDate ? '<p class="text-xs text-red-600">Eliminaci&oacute;n: ' + new Date(sub.deletionDate).toLocaleDateString('es-CO') + '</p>' : '') +
              '</div>';
          } catch(e) {
            resultDiv.innerHTML = '<div class="p-3 rounded-xl bg-red-50 border border-red-200 text-center"><p class="text-sm text-red-500">Error al leer datos: ' + e.message + '</p></div>';
          }
        };

        // Simulate states
        document.querySelectorAll('.sub-sim-btn').forEach(function(btn) {
          btn.onclick = function() {
            var email = document.getElementById('sub-sim-email').value.trim();
            var state = btn.dataset.state;
            var resultEl = document.getElementById('sub-sim-result');
            if (!email) {
              resultEl.classList.remove('hidden');
              resultEl.className = 'text-xs text-center text-red-500';
              resultEl.textContent = 'Ingresa un email primero';
              return;
            }

            var subKey = 'dya_subscription_' + email;
            var now = new Date().toISOString();
            var sub;
            try { sub = JSON.parse(localStorage.getItem(subKey) || 'null'); } catch(e) { sub = null; }
            if (!sub) {
              sub = {
                email: email, plan: 'mensual', status: 'trial',
                startDate: now, expiresAt: '', trialEndsAt: '', lastPaymentDate: '',
                lastPaymentId: '', nextPaymentDue: '', gracePeriodEndsAt: '',
                deletionDate: '',
                reminders: { day7:false,day3:false,day2:false,day1:false,expired:false,grace5:false,grace3:false,grace1:false,deleteWarning7:false,deleteWarning3:false,deleteWarning1:false },
                paymentHistory: []
              };
            }

            function addDays(dateStr, days) {
              var d = new Date(dateStr);
              d.setDate(d.getDate() + days);
              return d.toISOString();
            }

            switch(state) {
              case 'trial':
                sub.status = 'trial';
                sub.startDate = now;
                sub.trialEndsAt = addDays(now, 7);
                sub.expiresAt = sub.trialEndsAt;
                sub.gracePeriodEndsAt = '';
                sub.deletionDate = '';
                break;
              case 'active':
                sub.status = 'active';
                sub.startDate = now;
                sub.expiresAt = addDays(now, 30);
                sub.lastPaymentDate = now;
                sub.lastPaymentId = 'SIM_' + Date.now();
                sub.gracePeriodEndsAt = '';
                sub.deletionDate = '';
                break;
              case 'expired':
                sub.status = 'expired';
                sub.expiresAt = addDays(now, -1);
                sub.gracePeriodEndsAt = addDays(now, 4);
                sub.deletionDate = '';
                break;
              case 'grace':
                sub.status = 'grace';
                sub.expiresAt = addDays(now, -3);
                sub.gracePeriodEndsAt = addDays(now, 2);
                sub.deletionDate = '';
                break;
              case 'blocked':
                sub.status = 'blocked';
                sub.expiresAt = addDays(now, -10);
                sub.gracePeriodEndsAt = addDays(now, -5);
                sub.deletionDate = addDays(now, 20);
                break;
              case 'deleted':
                sub.status = 'deleted';
                sub.expiresAt = addDays(now, -40);
                sub.gracePeriodEndsAt = addDays(now, -35);
                sub.deletionDate = addDays(now, -1);
                break;
            }

            localStorage.setItem(subKey, JSON.stringify(sub));
            resultEl.classList.remove('hidden');
            resultEl.className = 'text-xs text-center text-emerald-600';
            resultEl.textContent = 'Estado de ' + email + ' cambiado a: ' + state;
            setTimeout(function() { resultEl.classList.add('hidden'); }, 3000);

      // ===== MERCADO PAGO CONFIG =====
      function bindMercadoPagoEvents() {
        var saveBtn = document.getElementById('mp-cfg-save');
        if (saveBtn) {
          saveBtn.onclick = function () {
            var obj = {
              sandbox: document.getElementById('mp-cfg-sandbox').checked,
              priceCOP: parseInt(document.getElementById('mp-cfg-cop').value) || 50000,
              priceUSD: parseInt(document.getElementById('mp-cfg-usd').value) || 30,
              trialDays: parseInt(document.getElementById('mp-cfg-trial-days').value) || 7,
              graceDays: parseInt(document.getElementById('mp-cfg-grace-days').value) || 5,
              deletionDays: parseInt(document.getElementById('mp-cfg-deletion-days').value) || 30,
              discountTrimestral: parseInt(document.getElementById('mp-cfg-disc-tri').value) || 10,
              discountAnual: parseInt(document.getElementById('mp-cfg-disc-an').value) || 25,
              emailReminders: document.getElementById('mp-cfg-email-rem').checked,
              whatsappReminders: document.getElementById('mp-cfg-wa-rem').checked
            };
            localStorage.setItem('dya_config_mercadopago', JSON.stringify(obj));
            var msg = document.getElementById('mp-cfg-saved');
            msg.classList.remove('hidden');
            setTimeout(function () { msg.classList.add('hidden'); }, 2500);
          };
        }
        var testBtn = document.getElementById('mp-test-conn');
        if (testBtn) {
          testBtn.onclick = function () {
            var cfg = getConfig();
            var pubKey = cfg['MP_PUBLIC_KEY'] || '';
            var result = document.getElementById('mp-test-result');
            result.classList.remove('hidden');
            if (!pubKey) {
              result.className = 'text-xs text-center mt-2 text-red-500';
              result.textContent = 'No hay Public Key configurada. Ve a la pesta\u00f1a API Config.';
              return;
            }
            if (!/^(APP_USR|TEST)-/.test(pubKey)) {
              result.className = 'text-xs text-center mt-2 text-amber-600';
              result.textContent = 'Formato de Public Key no reconocido. Debe empezar con APP_USR- o TEST-';
              return;
            }
            result.className = 'text-xs text-center mt-2 text-emerald-600';
            result.textContent = 'Public Key tiene formato v\u00e1lido: ' + pubKey.substring(0, 12) + '...';
          };
        }
      }

        if (saveBtn) {
          saveBtn.onclick = function () {
            var obj = {
              enableCicPlus: document.getElementById('wbl-cfg-cicplus').checked,
              enableColmi: document.getElementById('wbl-cfg-colmi').checked,
              enableMedicalMonitoring: document.getElementById('wbl-cfg-medmon').checked,
              enableEmergencyAlerts: document.getElementById('wbl-cfg-emalert').checked,
              enableApneaDetection: document.getElementById('wbl-cfg-apnea').checked,
              enableArrhythmiaDetection: document.getElementById('wbl-cfg-arrhythmia').checked,
              enableFallDetection: document.getElementById('wbl-cfg-fall').checked,
              defaultHRHigh: parseInt(document.getElementById('wbl-cfg-hr-high').value) || 120,
              defaultHRLow: parseInt(document.getElementById('wbl-cfg-hr-low').value) || 50,
              defaultSpo2Low: parseInt(document.getElementById('wbl-cfg-spo2').value) || 92,
              defaultBPSysHigh: parseInt(document.getElementById('wbl-cfg-bp-sys').value) || 140,
              defaultBPDiaHigh: parseInt(document.getElementById('wbl-cfg-bp-dia').value) || 90,
              emergencyNotifMethod: document.getElementById('wbl-cfg-notif-method').value || 'whatsapp'
            };
            localStorage.setItem('dya_config_wearables', JSON.stringify(obj));
            var msg = document.getElementById('wbl-cfg-saved');
            msg.classList.remove('hidden');
            setTimeout(function () { msg.classList.add('hidden'); }, 2500);
          };
        }
        // Seed defaults on first load
        if (!localStorage.getItem('dya_config_wearables')) {
          localStorage.setItem('dya_config_wearables', JSON.stringify({
            enableCicPlus: true,
            enableColmi: true,
            enableMedicalMonitoring: true,
            enableEmergencyAlerts: true,
            enableApneaDetection: true,
            enableArrhythmiaDetection: true,
            enableFallDetection: false,
            defaultHRHigh: 120,
            defaultHRLow: 50,
            defaultSpo2Low: 92,
            defaultBPSysHigh: 140,
            defaultBPDiaHigh: 90,
            emergencyNotifMethod: 'whatsapp'
          }));
        }
      }

      // ===== Collapsible sections =====
      function bindSectionToggles() {
        document.querySelectorAll('.section-toggle').forEach(function (btn) {
          btn.onclick = function () {
            var id = btn.dataset.section;
            var sec = document.getElementById('section-' + id);
            var chev = document.querySelector('.section-chevron[data-section="' + id + '"]');
            sec.classList.toggle('open');
            if (sec.classList.contains('open')) {
              chev.style.transform = 'rotate(180deg)';
            } else {
              chev.style.transform = 'rotate(0deg)';
            }
          };
        });
      }

      // ===== CONDITIONS =====
      function bindConditionEvents() {
        document.getElementById('add-condition').onclick = function () {
          var name = document.getElementById('new-condition-name').value.trim();
          var icon = document.getElementById('new-condition-icon').value.trim() || '&#x2695;';
          if (!name) return;
          var conds = getConditions();
          conds.push({ name: name, icon: icon, active: true });
          saveConditions(conds);
          renderAppConfigTab(document.getElementById('tab-content'));
          reopenSection('conditions');
        };
        document.querySelectorAll('[data-cond-toggle]').forEach(function (inp) {
          inp.onchange = function () {
            var conds = getConditions();
            conds[parseInt(inp.dataset.condToggle)].active = inp.checked;
            saveConditions(conds);
          };
        });
        document.querySelectorAll('[data-cond-del]').forEach(function (btn) {
          btn.onclick = function () {
            if (!confirm('Eliminar esta condici\u00f3n?')) return;
            var conds = getConditions();
            conds.splice(parseInt(btn.dataset.condDel), 1);
            saveConditions(conds);
            renderAppConfigTab(document.getElementById('tab-content'));
            reopenSection('conditions');
          };
        });
      }

      // ===== ALLERGIES =====
      function bindAllergyEvents() {
        document.getElementById('add-allergy').onclick = function () {
          var name = document.getElementById('new-allergy-name').value.trim();
          var icon = document.getElementById('new-allergy-icon').value.trim() || '&#x26A0;';
          if (!name) return;
          var list = getAllergies();
          list.push({ name: name, icon: icon, active: true });
          saveAllergies(list);
          renderAppConfigTab(document.getElementById('tab-content'));
          reopenSection('allergies');
        };
        document.querySelectorAll('[data-allergy-toggle]').forEach(function (inp) {
          inp.onchange = function () {
            var list = getAllergies();
            list[parseInt(inp.dataset.allergyToggle)].active = inp.checked;
            saveAllergies(list);
          };
        });
        document.querySelectorAll('[data-allergy-del]').forEach(function (btn) {
          btn.onclick = function () {
            if (!confirm('Eliminar esta alergia?')) return;
            var list = getAllergies();
            list.splice(parseInt(btn.dataset.allergyDel), 1);
            saveAllergies(list);
            renderAppConfigTab(document.getElementById('tab-content'));

          };

      }

      // ===== SPECIALTIES =====
      function bindSpecialtyEvents() {
        document.getElementById('add-specialty').onclick = function () {
          var name = document.getElementById('new-specialty').value.trim();
          if (!name) return;
          var list = getSpecialties();
          list.push(name);

          renderAppConfigTab(document.getElementById('tab-content'));

            list.splice(parseInt(btn.dataset.specDel), 1);
            saveSpecialties(list);
            renderAppConfigTab(document.getElementById('tab-content'));

      // ===== FOOD RULES =====
      function bindFoodRuleEvents() {
        var sel = document.getElementById('food-condition-select');
        sel.onchange = function () { renderFoodRulesForCondition(sel.value); };
      }

      function renderFoodRulesForCondition(condName) {
        var container = document.getElementById('food-rules-content');
        if (!condName) { container.innerHTML = ''; return; }
        var rules = getFoodRules();
        if (!rules[condName]) { rules[condName] = { recommended: [], notRecommended: [] }; saveFoodRules(rules); }
        var data = rules[condName];

        var html = '';
        // Recommended
        html += '<div class="mb-5">' +
          '<h4 class="text-sm font-bold text-emerald-700 mb-3 flex items-center gap-2">&#x2705; Alimentos Recomendados</h4>' +
          '<div class="flex gap-2 mb-3">' +
            '<input type="text" id="food-rec-name" placeholder="Alimento..." class="flex-1 px-3 py-2 bg-gray-50 rounded-lg border border-gray-200 text-sm">' +
            '<input type="text" id="food-rec-reason" placeholder="Por qu\u00e9 ayuda..." class="flex-1 px-3 py-2 bg-gray-50 rounded-lg border border-gray-200 text-sm">' +
            '<button id="add-food-rec" class="px-3 py-2 rounded-lg bg-emerald-500 text-white text-xs font-bold hover:bg-emerald-600 transition shrink-0">+</button>' +
          '</div>' +
          '<div class="space-y-2">';
        data.recommended.forEach(function (item, i) {
          html += '<div class="flex items-start gap-2 p-3 rounded-lg bg-emerald-50 border border-emerald-100">' +
            '<div class="flex-1"><p class="text-sm font-semibold text-emerald-800">' + esc(item.food) + '</p>' +
            '<p class="text-xs text-emerald-600">' + esc(item.reason) + '</p></div>' +
            '<button class="w-7 h-7 rounded-lg bg-red-100 text-red-500 hover:bg-red-200 transition text-xs font-bold shrink-0" data-food-rec-del="' + i + '">&#x2715;</button>' +
            '</div>';
        });
        html += '</div></div>';

        // Not Recommended
        html += '<div>' +
          '<h4 class="text-sm font-bold text-red-700 mb-3 flex items-center gap-2">&#x274C; Alimentos NO Recomendados</h4>' +
          '<div class="flex gap-2 mb-3">' +
            '<input type="text" id="food-norec-name" placeholder="Alimento..." class="flex-1 px-3 py-2 bg-gray-50 rounded-lg border border-gray-200 text-sm">' +
            '<input type="text" id="food-norec-reason" placeholder="Por qu\u00e9 evitar..." class="flex-1 px-3 py-2 bg-gray-50 rounded-lg border border-gray-200 text-sm">' +
            '<button id="add-food-norec" class="px-3 py-2 rounded-lg bg-red-500 text-white text-xs font-bold hover:bg-red-600 transition shrink-0">+</button>' +
          '</div>' +
          '<div class="space-y-2">';
        data.notRecommended.forEach(function (item, i) {
          html += '<div class="flex items-start gap-2 p-3 rounded-lg bg-red-50 border border-red-100">' +
            '<div class="flex-1"><p class="text-sm font-semibold text-red-800">' + esc(item.food) + '</p>' +
            '<p class="text-xs text-red-600">' + esc(item.reason) + '</p></div>' +
            '<button class="w-7 h-7 rounded-lg bg-red-200 text-red-600 hover:bg-red-300 transition text-xs font-bold shrink-0" data-food-norec-del="' + i + '">&#x2715;</button>' +
            '</div>';
        });
        html += '</div></div>';

        container.innerHTML = html;

        // Bind add/delete for food
        var currentCond = condName;
        document.getElementById('add-food-rec').onclick = function () {
          var food = document.getElementById('food-rec-name').value.trim();
          var reason = document.getElementById('food-rec-reason').value.trim();
          if (!food) return;
          var rules = getFoodRules();
          if (!rules[currentCond]) rules[currentCond] = { recommended: [], notRecommended: [] };
          rules[currentCond].recommended.push({ food: food, reason: reason || '' });
          saveFoodRules(rules);
          renderFoodRulesForCondition(currentCond);
        };
        document.getElementById('add-food-norec').onclick = function () {
          var food = document.getElementById('food-norec-name').value.trim();
          var reason = document.getElementById('food-norec-reason').value.trim();
          if (!food) return;
          var rules = getFoodRules();
          if (!rules[currentCond]) rules[currentCond] = { recommended: [], notRecommended: [] };
          rules[currentCond].notRecommended.push({ food: food, reason: reason || '' });
          saveFoodRules(rules);
          renderFoodRulesForCondition(currentCond);
        };
        document.querySelectorAll('[data-food-rec-del]').forEach(function (btn) {
          btn.onclick = function () {
            var rules = getFoodRules();
            rules[currentCond].recommended.splice(parseInt(btn.dataset.foodRecDel), 1);
            saveFoodRules(rules);
            renderFoodRulesForCondition(currentCond);
          };
        });
        document.querySelectorAll('[data-food-norec-del]').forEach(function (btn) {
          btn.onclick = function () {
            var rules = getFoodRules();
            rules[currentCond].notRecommended.splice(parseInt(btn.dataset.foodNorecDel), 1);
            saveFoodRules(rules);
            renderFoodRulesForCondition(currentCond);
          };
        });
      }

      // ===== EXERCISE RULES =====
      function bindExerciseRuleEvents() {
        var sel = document.getElementById('exercise-condition-select');
        sel.onchange = function () { renderExerciseRulesForCondition(sel.value); };
      }

      function renderExerciseRulesForCondition(condName) {
        var container = document.getElementById('exercise-rules-content');
        if (!condName) { container.innerHTML = ''; return; }
        var rules = getExerciseRules();
        if (!rules[condName]) { rules[condName] = []; saveExerciseRules(rules); }
        var data = rules[condName];

        var html = '<div class="flex gap-2 mb-4">' +
          '<input type="text" id="exercise-restriction" placeholder="Restricci\u00f3n..." class="flex-1 px-3 py-2 bg-gray-50 rounded-lg border border-gray-200 text-sm">' +
          '<select id="exercise-severity" class="w-24 px-2 py-2 bg-gray-50 rounded-lg border border-gray-200 text-sm">' +
            '<option value="Baja">Baja</option><option value="Media">Media</option><option value="Alta" selected>Alta</option>' +
          '</select>' +
          '<button id="add-exercise-rule" class="px-3 py-2 rounded-lg bg-emerald-500 text-white text-xs font-bold hover:bg-emerald-600 transition shrink-0">+</button>' +
          '</div>';
        html += '<div class="space-y-2">';
        data.forEach(function (item, i) {
          var sevColor = item.severity === 'Alta' ? 'bg-red-100 text-red-700' : (item.severity === 'Media' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700');
          html += '<div class="flex items-center gap-2 p-3 rounded-lg bg-gray-50 border border-gray-100">' +
            '<span class="text-[10px] px-2 py-0.5 rounded-full font-bold ' + sevColor + '">' + esc(item.severity) + '</span>' +
            '<span class="flex-1 text-sm text-gray-700">' + esc(item.restriction) + '</span>' +
            '<button class="w-7 h-7 rounded-lg bg-red-100 text-red-500 hover:bg-red-200 transition text-xs font-bold shrink-0" data-exr-del="' + i + '">&#x2715;</button>' +
            '</div>';
        });
        html += '</div>';
        container.innerHTML = html;

        var currentCond = condName;
        document.getElementById('add-exercise-rule').onclick = function () {
          var restriction = document.getElementById('exercise-restriction').value.trim();
          var severity = document.getElementById('exercise-severity').value;
          if (!restriction) return;
          var rules = getExerciseRules();
          if (!rules[currentCond]) rules[currentCond] = [];
          rules[currentCond].push({ restriction: restriction, severity: severity });
          saveExerciseRules(rules);
          renderExerciseRulesForCondition(currentCond);
        };
        document.querySelectorAll('[data-exr-del]').forEach(function (btn) {
          btn.onclick = function () {
            var rules = getExerciseRules();
            rules[currentCond].splice(parseInt(btn.dataset.exrDel), 1);
            saveExerciseRules(rules);
            renderExerciseRulesForCondition(currentCond);
          };
        });
      }

      // ===== DOCTOR MANAGEMENT =====
      function bindDoctorEvents() {
        document.querySelectorAll('[data-doc-toggle]').forEach(function (btn) {
          btn.onclick = function () {
            var docs = getDoctors();
            var idx = parseInt(btn.dataset.docToggle);
            var d = docs[idx];
            if (d.status === 'active' || d.status === 'verified') {
              d.status = 'inactive';
            } else {
              d.status = 'active';
            }
            docs[idx] = d;
            saveDoctors(docs);
            renderAppConfigTab(document.getElementById('tab-content'));
            reopenSection('doctors');
          };
        });
        document.querySelectorAll('[data-doc-view]').forEach(function (btn) {
          btn.onclick = function () {
            var docs = getDoctors();
            var d = docs[parseInt(btn.dataset.docView)];
            var patients = d.patients || [];
            if (patients.length === 0) {
              alert('Este m\u00e9dico no tiene pacientes asignados.');
            } else {
              alert('Pacientes de ' + d.name + ':\n\n' + patients.map(function (p) { return '- ' + (p.name || p); }).join('\n'));
            }
          };
        });
      }

      // ===== Helper: reopen a section after re-render =====
      function reopenSection(id) {
        var sec = document.getElementById('section-' + id);
        var chev = document.querySelector('.section-chevron[data-section="' + id + '"]');
        if (sec) { sec.classList.add('open'); }
        if (chev) { chev.style.transform = 'rotate(180deg)'; }
      }
    })();
  </script>
